name: CI-CD

on:
  push:
    branches:
      - main
      - development
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run deterministic regression tests when present
        shell: bash
        run: |
          set -euo pipefail

          tests=(
            "tests/test_nlu_regressions.py"
            "tests/test_name_capture_context.py"
            "tests/test_failed_evaluation_regressions.py"
            "tests/task4_monitoring/test_monitoring.py"
            "tests/task5_deployment/test_deployment_structure.py"
          )

          for test_file in "${tests[@]}"; do
            if [[ -f "$test_file" ]]; then
              echo "Running $test_file"
              python "$test_file"
            fi
          done

  docker-build-and-smoke-test:
    name: Docker build + health smoke test
    runs-on: ubuntu-latest
    needs: python-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --tag realestate-voice-agent:${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run -d \
            --name realestate-agent-ci \
            -p 8000:8000 \
            -e APP_ENV=ci \
            -e GROQ_API_KEY=ci-placeholder \
            -e REQUIRE_CALENDAR_FOR_READINESS=0 \
            -e REQUIRE_EMAIL_FOR_READINESS=0 \
            -e REQUIRE_VOICE_FOR_READINESS=0 \
            -e REQUIRE_RAG_FOR_READINESS=0 \
            -e RAG_WARMUP_ON_API_START=0 \
            realestate-voice-agent:${{ github.sha }}

      - name: Smoke test liveness and readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              break
            fi

            if [[ "$attempt" == "30" ]]; then
              echo "Container did not become live"
              docker logs realestate-agent-ci
              exit 1
            fi

            sleep 2
          done

          curl --fail --show-error \
            http://127.0.0.1:8000/health/live

          curl --fail --show-error \
            http://127.0.0.1:8000/health/ready

      - name: Show container logs on failure
        if: failure()
        run: docker logs realestate-agent-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f realestate-agent-ci || true

  deployment-gate:
    name: Deployment readiness gate
    runs-on: ubuntu-latest
    needs:
      - python-validation
      - docker-build-and-smoke-test

    steps:
      - name: Ready
        run: |
          echo "Python validation passed."
          echo "Docker image built successfully."
          echo "Liveness/readiness smoke test passed."
          echo "Artifact is ready for deployment."
