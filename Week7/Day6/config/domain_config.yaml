# Domain Configuration
# This file is what makes the voice agent platform domain-agnostic.
# To reuse this system for a different business (clinic, restaurant, etc),
# you swap this file plus the data/ and documents/ folders. No pipeline code changes.

domain:
  name: "real_estate"
  display_name: "RealEstate Hub"
  description: "Real estate agency handling buy, rent, commercial, and investment inquiries"

# Structured entity = lives in SQL, used for exact facts (price, availability, size, agent name)
structured_entities:
  primary_table: "properties"
  fields:
    - id
    - title
    - property_type      # house, apartment, plot, shop, office, warehouse
    - purpose             # buy, rent, commercial, investment
    - city
    - area
    - bedrooms
    - bathrooms
    - size_marla
    - price_pkr
    - status              # available, sold, rented, reserved
    - developer_id
    - agent_name
    - agent_phone

  lookup_tables:
    - locations
    - amenities
    - schools
    - hospitals
    - payment_plans
    - developers

# Semantic entity = lives in vector store, used for descriptive / unstructured content
semantic_entities:
  - name: brochures
    source_folder: "documents/brochures"
    description: "Marketing brochure text per property, descriptive and persuasive language"
  - name: descriptions
    source_folder: "documents/descriptions"
    description: "Neutral factual property descriptions with amenities, nearby schools/hospitals"
  - name: faqs
    source_folder: "data/faqs.csv"
    description: "Common customer questions and answers about the business"

# Recommendation scoring weights (used by recommendation_engine.py)
recommendation_weights:
  budget_fit: 0.35
  location_match: 0.25
  bedroom_match: 0.15
  amenity_match: 0.15
  purpose_match: 0.10

# RAG settings, tunable without touching code
rag:
  chunk_sizes_to_evaluate: [100, 200, 400]
  default_chunk_size: 200
  chunk_overlap: 40
  top_k: 4
